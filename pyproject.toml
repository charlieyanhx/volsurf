[project]
name = "volsurf"
version = "0.2.0"
description = "Implied-volatility surfaces from option chains: parity forwards, a vectorised Black inverter, raw-SVI slice fits with static-arbitrage checks (butterfly g(k) on a declared range plus wing asymptotes, calendar between slices, quote-level within-band checks), fit quality in vol points and bid/ask coverage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hanxiong (Charlie) Yan" }]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "pyarrow>=15"]
# the four pricers oracle tests need the sibling repo installed by hand: pip install -e ../pricers (not on PyPI)
oracle = ["lets-be-rational>=1.1.2"]
# the tool layer (volsurf.mcp) needs nothing extra to run or test; these add the server and a live chain source
mcp = ["mcp>=1.0"]
live = ["yfinance>=0.2"]

[project.urls]
Homepage = "https://github.com/charlieyanhx/volsurf"

[project.scripts]
volsurf = "volsurf.cli:main"
volsurf-mcp = "volsurf.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volsurf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
